name: CI

on:
  push:
    branches: [main]
    paths:
      - Sources/**
      - Package.swift
      - Package.resolved
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - Sources/**
      - Package.swift
      - Package.resolved
      - .github/workflows/ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Smoke test (--help)
        run: .build/release/fledge-music --help
